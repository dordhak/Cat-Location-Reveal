name: Deploy Flutter Web to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Riverpod code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create web environment file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          : "${SUPABASE_URL:?SUPABASE_URL secret is required}"
          : "${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY secret is required}"
          printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s"}\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > env.json

      - name: Build Flutter Web
        run: |
          flutter build web \
            --release \
            --base-href "/" \
            --dart-define-from-file=env.json

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=cat-location-reveal