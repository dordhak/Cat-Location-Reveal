name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Riverpod code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create web environment file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          : "${SUPABASE_URL:?SUPABASE_URL secret is required}"
          : "${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY secret is required}"
          printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s"}\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > env.json

      - name: Inject Google Maps web key
        env:
          WEB_MAPS_API_KEY: ${{ secrets.WEB_MAPS_API_KEY }}
        run: |
          : "${WEB_MAPS_API_KEY:?WEB_MAPS_API_KEY secret is required}"
          sed -i "s|__MAPS_WEB_KEY__|${WEB_MAPS_API_KEY}|g" web/index.html

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/Cat-Location-Reveal/" --dart-define-from-file=env.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4